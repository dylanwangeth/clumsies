name: Hub Server E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hub-e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clumsies
          POSTGRES_USER: clumsies
          POSTGRES_PASSWORD: clumsies
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clumsies"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - name: Build clumsies
        run: zig build

      - name: Run Hub E2E tests
        run: ./test/hub-e2e.sh ./zig-out/bin/clumsies
        env:
          PGPASSWORD: clumsies
