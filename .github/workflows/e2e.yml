name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            script: bash test/e2e.sh
          - os: macos-latest
            script: bash test/e2e.sh
          - os: windows-latest
            script: pwsh test/e2e.ps1

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - name: Build
        run: zig build

      - name: Configure git identity
        run: |
          git config --global user.email "test@test.com"
          git config --global user.name "Test"

      - name: Run E2E tests
        run: ${{ matrix.script }}
        env:
          CLUMSIES: ./zig-out/bin/clumsies${{ matrix.os == 'windows-latest' && '.exe' || '' }}
