name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Lint (zig fmt)
        run: zig fmt --check src/

      - name: Build (native)
        run: zig build

      - name: Run CLI unit tests
        run: zig build test

      - name: Check deployment scripts
        run: |
          bash -n deploy/server/*.sh
          shellcheck deploy/server/*.sh
          bash deploy/server/server-release-test.sh

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      # Keep producing results for every target even if one fails;
      # a break on one platform should not mask a break on another.
      fail-fast: false
      matrix:
        target:
          - aarch64-macos
          - x86_64-macos
          - aarch64-linux
          - x86_64-linux
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cross-compile (${{ matrix.target }})
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install docs dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        run: bun run build

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check API contracts and client
        run: bun run api:check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Rust tests
        run: cargo test --workspace

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Run native macOS tests
        run: bun run test:macos

  # Aggregator so branch protection rules that require a single "build"
  # status check continue to resolve after the split. Also gives a
  # convenient one-line pass/fail signal on the PR page.
  build:
    runs-on: ubuntu-latest
    needs: [lint, cross-compile, docs, api-contract, rust, macos]
    steps:
      - run: echo "All CI jobs passed."
