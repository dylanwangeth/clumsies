name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Lint (zig fmt)
        run: zig fmt --check src/

      - name: Build (native)
        run: zig build

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      # Keep producing results for every target even if one fails;
      # a break on one platform should not mask a break on another.
      fail-fast: false
      matrix:
        target:
          - aarch64-macos
          - x86_64-macos
          - aarch64-linux
          - x86_64-linux
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cross-compile (${{ matrix.target }})
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install docs dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        run: bun run build

  # Aggregator so branch protection rules that require a single "build"
  # status check continue to resolve after the split. Also gives a
  # convenient one-line pass/fail signal on the PR page.
  build:
    runs-on: ubuntu-latest
    needs: [lint, cross-compile, docs]
    steps:
      - run: echo "All CI jobs passed."
