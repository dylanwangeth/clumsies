name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check deployment scripts
        run: |
          bash -n deploy/server/*.sh
          shellcheck deploy/server/*.sh
          bash deploy/server/server-release-test.sh

      - name: Check Agent runtime archive boundary
        run: |
          shellcheck dev/check-agent-runtime-boundary.sh
          sh dev/check-agent-runtime-boundary.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install docs dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        run: bun run build

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check API contracts and client
        run: bun run api:check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Rust tests
        run: cargo test --workspace

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Lint (clippy, daemon)
        run: cargo clippy -p daemon -- -D warnings

      - name: Run native macOS tests
        run: bun run test:macos

      - name: Run Agent runtime process and XPC integration
        run: cargo test -p daemon --test agent_runtime_xpc_e2e -- --nocapture

      - name: Build and verify the signed Agent runtime package
        run: bun run test:macos:package

  # Aggregator so branch protection rules that require a single "build"
  # status check continue to resolve after the split. Also gives a
  # convenient one-line pass/fail signal on the PR page.
  build:
    runs-on: ubuntu-latest
    needs: [scripts, docs, api-contract, rust, macos]
    steps:
      - run: echo "All CI jobs passed."
