[package]
name = "clumsies-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "clumsies_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clumsies-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
daemon = { version = "0.1.0", path = "../../../crates/daemon" }
reqwest = { version = "0.13.4", features = ["json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.0"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1.52.3", features = ["io-util", "net", "time"] }
url = "2.5.8"
uuid = { version = "1.23.4", features = ["v4"] }
