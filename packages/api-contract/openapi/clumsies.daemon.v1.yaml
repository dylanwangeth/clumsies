openapi: 3.1.0
info:
  title: clumsies Local Daemon IPC Schema
  version: 1.0.0
  summary: Schema-only local daemon IPC contract for local daemon clients.
security: []
paths: {}
components:
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    DaemonIpcTransport:
      type: string
      enum: [macos_xpc_mach_service]
    DaemonIpcEndpoint:
      type: object
      required: [transport, service_name]
      properties:
        transport:
          $ref: "#/components/schemas/DaemonIpcTransport"
        service_name:
          type: string
    DaemonIpcRequest:
      type: object
      required: [method, payload]
      properties:
        method:
          type: string
        payload:
          type: object
          additionalProperties: true
    DaemonIpcResponse:
      type: object
      required: [ok, payload, error]
      properties:
        ok:
          type: boolean
        payload:
          type: object
          additionalProperties: true
        error:
          oneOf:
            - $ref: "#/components/schemas/ApiError"
            - type: "null"
    DaemonBootstrapStatus:
      type: object
      required:
        - label
        - mach_service_name
        - plist_path
        - installed
        - endpoint
        - runtime
      properties:
        label:
          type: string
        mach_service_name:
          type: string
        plist_path:
          type: string
        installed:
          type: boolean
        endpoint:
          $ref: "#/components/schemas/DaemonIpcEndpoint"
        runtime:
          $ref: "#/components/schemas/LaunchAgentRuntimeStatus"
    LaunchAgentRuntimeStatus:
      type: object
      required:
        - installed
        - bootstrapped
        - running
        - pid
        - state
        - last_exit_code
        - last_error
      properties:
        installed:
          type: boolean
        bootstrapped:
          type: boolean
        running:
          type: boolean
        pid:
          type: [integer, "null"]
        state:
          type: [string, "null"]
        last_exit_code:
          type: [integer, "null"]
        last_error:
          type: [string, "null"]
    DaemonProjectConfig:
      type: object
      required:
        - server_url
        - project_id
        - has_access_token
        - has_refresh_token
        - ready
        - missing_fields
      properties:
        server_url:
          type: string
          format: uri
        project_id:
          type: [string, "null"]
        has_access_token:
          type: boolean
          description: Whether the daemon loaded an access token from macOS Keychain.
        has_refresh_token:
          type: boolean
          description: Whether the daemon loaded a refresh token from macOS Keychain.
        ready:
          type: boolean
        missing_fields:
          type: array
          items:
            type: string
    DaemonProjectConfigUpdateRequest:
      type: object
      required: [server_url, project_id, access_token, refresh_token]
      properties:
        server_url:
          type: string
          format: uri
        project_id:
          type: [string, "null"]
        access_token:
          type: [string, "null"]
          description: Written directly to macOS Keychain and never returned by daemon APIs.
        refresh_token:
          type: [string, "null"]
          description: Written atomically with the access token to macOS Keychain and never returned.
    DaemonProjectSelectionRequest:
      type: object
      required: [project_id]
      properties:
        project_id:
          type: string
    DaemonMemoryCacheRequest:
      type: object
      required: [project_id]
      properties:
        project_id:
          type: string
    DaemonMemoryCacheStatus:
      type: object
      required: [project_id, commit_id, root_path, ready]
      properties:
        project_id:
          type: string
        commit_id:
          type: [string, "null"]
        root_path:
          type: [string, "null"]
        ready:
          type: boolean
    DaemonServerRequest:
      type: object
      required: [method, path, headers, body]
      properties:
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
        path:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: [string, "null"]
    DaemonServerResponse:
      type: object
      required: [status, headers, body]
      properties:
        status:
          type: integer
          minimum: 100
          maximum: 599
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
    DaemonHealth:
      type: object
      required:
        - daemon_version
        - server_url
        - project_id
        - daemon_installation_id
        - log_dir
        - local_db
      properties:
        daemon_version:
          type: string
        server_url:
          type: string
        project_id:
          type: [string, "null"]
        daemon_installation_id:
          type: string
        log_dir:
          type: string
        local_db:
          $ref: "#/components/schemas/LocalDbStatus"
    LocalDbStatus:
      type: object
      required: [path, ready, schema_version]
      properties:
        path:
          type: string
        ready:
          type: boolean
        schema_version:
          type: integer
    DaemonSyncStatus:
      type: object
      required:
        - draft_sync
        - commit_sync
        - pending_operation_count
        - failed_operation_count
        - conflict_count
        - last_success_at
      properties:
        draft_sync:
          $ref: "#/components/schemas/SyncChannelStatus"
        commit_sync:
          $ref: "#/components/schemas/SyncChannelStatus"
        pending_operation_count:
          type: integer
        failed_operation_count:
          type: integer
        conflict_count:
          type: integer
        last_success_at:
          type: [string, "null"]
          format: date-time
    SyncChannelStatus:
      type: object
      required: [state, server_cursor, last_attempt_at, last_success_at, last_error]
      properties:
        state:
          $ref: "#/components/schemas/SyncState"
        server_cursor:
          type: [string, "null"]
        last_attempt_at:
          type: [string, "null"]
          format: date-time
        last_success_at:
          type: [string, "null"]
          format: date-time
        last_error:
          oneOf:
            - $ref: "#/components/schemas/ApiError"
            - type: "null"
    DaemonSyncRetryRequest:
      type: object
      required: [channel]
      properties:
        channel:
          type: string
          enum: [drafts, commits, all]
    DaemonRetryResponse:
      type: object
      required: [retry_id, started]
      properties:
        retry_id:
          type: string
        started:
          type: boolean
    DaemonMcpStatus:
      type: object
      required: [running, endpoint, adapters]
      properties:
        running:
          type: boolean
        endpoint:
          type: [string, "null"]
        adapters:
          type: array
          items:
            $ref: "#/components/schemas/McpAdapterStatus"
    McpAdapterStatus:
      type: object
      required: [name, running, last_error]
      properties:
        name:
          type: string
        running:
          type: boolean
        last_error:
          oneOf:
            - $ref: "#/components/schemas/ApiError"
            - type: "null"
    DaemonDraftListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DaemonDraftSummary"
    DaemonDraftDetail:
      type: object
      required: [draft, operations]
      properties:
        draft:
          $ref: "#/components/schemas/DaemonDraftSummary"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/DaemonLocalDraftOperation"
    DaemonDraftSummary:
      type: object
      required:
        - draft_id
        - project_id
        - server_draft_id
        - server_version
        - base_commit_id
        - scope
        - resource_kind
        - target_id
        - path
        - conflict
        - status
        - created_at
        - updated_at
        - pending_operation_count
        - failed_operation_count
      properties:
        draft_id:
          type: string
        project_id:
          type: string
        server_draft_id:
          type: [string, "null"]
        server_version:
          type: integer
        base_commit_id:
          type: [string, "null"]
        scope:
          $ref: "#/components/schemas/DaemonDraftScope"
        resource_kind:
          $ref: "#/components/schemas/DaemonDraftResourceKind"
        target_id:
          type: [string, "null"]
        path:
          type: [string, "null"]
        conflict:
          oneOf:
            - $ref: "#/components/schemas/DaemonDraftConflict"
            - type: "null"
        status:
          $ref: "#/components/schemas/DaemonLocalDraftStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        pending_operation_count:
          type: integer
        failed_operation_count:
          type: integer
    DaemonDraftConflict:
      type: object
      required: [base_commit_id, current_commit_id, detected_at]
      properties:
        base_commit_id:
          type: [string, "null"]
        current_commit_id:
          type: [string, "null"]
        detected_at:
          type: string
          format: date-time
    DaemonLocalDraftOperation:
      type: object
      required:
        - local_operation_id
        - resource_kind
        - operation
        - source
        - sync_status
        - last_error
        - created_at
        - updated_at
      properties:
        local_operation_id:
          type: string
        resource_kind:
          $ref: "#/components/schemas/DaemonDraftResourceKind"
        operation:
          $ref: "#/components/schemas/DaemonDraftOperation"
        source:
          $ref: "#/components/schemas/DaemonDraftOperationRecordSource"
        sync_status:
          $ref: "#/components/schemas/DraftOperationSyncStatus"
        last_error:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DaemonDraftOperationRequest:
      type: object
      required: [project_id, scope, resource, op]
      properties:
        draft_id:
          type: [string, "null"]
        base_commit_id:
          type: [string, "null"]
        project_id:
          type: string
        scope:
          $ref: "#/components/schemas/DaemonDraftScope"
        resource:
          $ref: "#/components/schemas/DaemonDraftResourceKind"
        op:
          $ref: "#/components/schemas/DaemonDraftOperation"
        source:
          $ref: "#/components/schemas/DaemonDraftOperationSource"
    DaemonDraftOperation:
      type: object
      oneOf:
        - required: [create]
        - required: [update]
        - required: [rename]
        - required: [delete]
        - required: [discard]
      properties:
        create:
          $ref: "#/components/schemas/DaemonCreateDraftOperation"
        update:
          $ref: "#/components/schemas/DaemonUpdateDraftOperation"
        rename:
          $ref: "#/components/schemas/DaemonRenameDraftOperation"
        delete:
          $ref: "#/components/schemas/DaemonDeleteDraftOperation"
        discard:
          $ref: "#/components/schemas/DaemonDiscardDraftOperation"
    DaemonCreateDraftOperation:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          minLength: 1
          description: Portable normalized relative resource path using slash separators.
        content:
          $ref: "#/components/schemas/DaemonDraftContent"
        description:
          type: string
    DaemonUpdateDraftOperation:
      type: object
      required: [id, content]
      properties:
        id:
          type: string
        content:
          $ref: "#/components/schemas/DaemonDraftContent"
        description:
          type: string
    DaemonDraftContent:
      oneOf:
        - $ref: "#/components/schemas/DaemonContextDraftContent"
        - $ref: "#/components/schemas/DaemonRuleDraftContent"
        - $ref: "#/components/schemas/DaemonWorkflowDraftContent"
        - $ref: "#/components/schemas/DaemonMetapromptDraftContent"
    DaemonContextDraftContent:
      type: object
      required: [kind, content]
      properties:
        kind:
          type: string
          enum: [context]
        content:
          type: string
    DaemonRuleDraftContent:
      type: object
      required: [kind, constraint]
      properties:
        kind:
          type: string
          enum: [rule]
        name:
          type: [string, "null"]
        applies_when:
          type: [string, "null"]
        constraint:
          type: string
          minLength: 1
        tags:
          type: [array, "null"]
          items:
            type: string
    DaemonWorkflowDraftContent:
      type: object
      required: [kind, description, steps]
      properties:
        kind:
          type: string
          enum: [workflow]
        name:
          type: [string, "null"]
        description:
          type: string
        steps:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DaemonWorkflowStepInput"
    DaemonMetapromptDraftContent:
      type: object
      required: [kind, content]
      properties:
        kind:
          type: string
          enum: [metaprompt]
        content:
          type: string
    DaemonWorkflowStepInput:
      type: object
      required: [rule_id, body]
      properties:
        rule_id:
          type: [string, "null"]
        body:
          type: [string, "null"]
    DaemonRenameDraftOperation:
      type: object
      required: [id, new_path]
      properties:
        id:
          type: string
        new_path:
          type: string
          minLength: 1
          description: Portable normalized relative path used by the rename operation.
        description:
          type: string
    DaemonDeleteDraftOperation:
      type: object
      required: [id]
      properties:
        id:
          type: string
        description:
          type: string
    DaemonDiscardDraftOperation:
      type: object
      required: [id]
      properties:
        id:
          type: string
    DaemonDraftOperationResponse:
      type: object
      required: [local_operation_id, draft_id, queued, sync_status]
      properties:
        local_operation_id:
          type: string
        draft_id:
          type: string
        queued:
          type: boolean
        sync_status:
          $ref: "#/components/schemas/DraftOperationSyncStatus"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
    ApiError:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    SyncState:
      type: string
      enum: [idle, queued, syncing, retrying, degraded, conflicted, failed]
    DaemonDraftResourceKind:
      type: string
      enum: [context, rule, workflow, metaprompt]
    DaemonDraftScope:
      type: string
      enum: [org, project]
    DaemonLocalDraftStatus:
      type: string
      enum: [open, submitted, discarded, conflicted, merged]
    DaemonDraftOperationSource:
      type: string
      enum: [desktop, cli, mcp_store]
    DaemonDraftOperationRecordSource:
      type: string
      enum: [desktop, cli, mcp_store, server]
    DraftOperationSyncStatus:
      type: string
      enum: [queued, syncing, retrying, synced, failed]
