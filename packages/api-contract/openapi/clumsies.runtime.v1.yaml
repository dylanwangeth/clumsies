openapi: 3.1.0
info:
  title: clumsies Local Runtime API
  version: 1.0.0
  summary: Local runtime contract for Desktop renderer, CLI bridge, and MCP server.
servers:
  - url: http://127.0.0.1:0
security: []
paths:
  /runtime/health:
    get:
      operationId: getRuntimeHealth
      summary: Read local runtime health.
      responses:
        "200":
          description: Runtime health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeHealth"
        default:
          $ref: "#/components/responses/Error"
  /runtime/sync-status:
    get:
      operationId: getRuntimeSyncStatus
      summary: Read local sync status.
      responses:
        "200":
          description: Runtime sync status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSyncStatus"
        default:
          $ref: "#/components/responses/Error"
  /runtime/sync-retries:
    post:
      operationId: createRuntimeSyncRetry
      summary: Create a local sync retry request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeSyncRetryRequest"
      responses:
        "200":
          description: Sync retry request state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeRetryResponse"
        default:
          $ref: "#/components/responses/Error"
  /runtime/mcp-status:
    get:
      operationId: getRuntimeMcpStatus
      summary: Read local MCP server and adapter status.
      responses:
        "200":
          description: Runtime MCP status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeMcpStatus"
        default:
          $ref: "#/components/responses/Error"
  /runtime/mcp-restarts:
    post:
      operationId: createRuntimeMcpRestart
      summary: Create a local MCP server restart request.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeMcpRestartRequest"
      responses:
        "200":
          description: Runtime MCP restart result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeMcpRestartResponse"
        default:
          $ref: "#/components/responses/Error"
  /runtime/draft-operations:
    post:
      operationId: createRuntimeDraftOperation
      summary: Write a local draft operation and enqueue sync.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeDraftOperationRequest"
      responses:
        "200":
          description: Local draft operation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeDraftOperationResponse"
        default:
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    RuntimeHealth:
      type: object
      required:
        - runtime_version
        - hub_url
        - project_id
        - runtime_installation_id
        - sidecar
        - local_db
      properties:
        runtime_version:
          type: string
        hub_url:
          type: string
        project_id:
          type: [string, "null"]
        runtime_installation_id:
          type: string
        sidecar:
          $ref: "#/components/schemas/SidecarStatus"
        local_db:
          $ref: "#/components/schemas/LocalDbStatus"
    SidecarStatus:
      type: object
      required: [enabled, running, version]
      properties:
        enabled:
          type: boolean
        running:
          type: boolean
        version:
          type: [string, "null"]
    LocalDbStatus:
      type: object
      required: [path, ready, schema_version]
      properties:
        path:
          type: string
        ready:
          type: boolean
        schema_version:
          type: integer
    RuntimeSyncStatus:
      type: object
      required:
        - draft_sync
        - snapshot_sync
        - pending_operation_count
        - failed_operation_count
        - conflict_count
        - last_success_at
      properties:
        draft_sync:
          $ref: "#/components/schemas/SyncChannelStatus"
        snapshot_sync:
          $ref: "#/components/schemas/SyncChannelStatus"
        pending_operation_count:
          type: integer
        failed_operation_count:
          type: integer
        conflict_count:
          type: integer
        last_success_at:
          type: [string, "null"]
          format: date-time
    SyncChannelStatus:
      type: object
      required: [state, last_attempt_at, last_success_at, last_error]
      properties:
        state:
          $ref: "#/components/schemas/SyncState"
        last_attempt_at:
          type: [string, "null"]
          format: date-time
        last_success_at:
          type: [string, "null"]
          format: date-time
        last_error:
          oneOf:
            - $ref: "#/components/schemas/ApiError"
            - type: "null"
    RuntimeSyncRetryRequest:
      type: object
      required: [channel]
      properties:
        channel:
          type: string
          enum: [drafts, snapshots, all]
    RuntimeRetryResponse:
      type: object
      required: [retry_id, started]
      properties:
        retry_id:
          type: string
        started:
          type: boolean
    RuntimeMcpStatus:
      type: object
      required: [running, endpoint, adapters]
      properties:
        running:
          type: boolean
        endpoint:
          type: [string, "null"]
        adapters:
          type: array
          items:
            $ref: "#/components/schemas/McpAdapterStatus"
    RuntimeMcpRestartRequest:
      type: object
      properties:
        reason:
          type: [string, "null"]
    RuntimeMcpRestartResponse:
      allOf:
        - $ref: "#/components/schemas/RuntimeMcpStatus"
        - type: object
          required: [restart_id]
          properties:
            restart_id:
              type: string
    McpAdapterStatus:
      type: object
      required: [name, running, last_error]
      properties:
        name:
          type: string
        running:
          type: boolean
        last_error:
          oneOf:
            - $ref: "#/components/schemas/ApiError"
            - type: "null"
    RuntimeDraftOperationRequest:
      type: object
      required: [resource, op]
      properties:
        resource:
          $ref: "#/components/schemas/RuntimeDraftResourceKind"
        op:
          $ref: "#/components/schemas/RuntimeDraftOperation"
        source:
          type: string
          enum: [desktop, cli, mcp_store]
    RuntimeDraftOperation:
      type: object
      oneOf:
        - required: [create]
        - required: [update]
        - required: [rename]
        - required: [delete]
        - required: [discard]
      properties:
        create:
          $ref: "#/components/schemas/RuntimeCreateDraftOperation"
        update:
          $ref: "#/components/schemas/RuntimeUpdateDraftOperation"
        rename:
          $ref: "#/components/schemas/RuntimeRenameDraftOperation"
        delete:
          $ref: "#/components/schemas/RuntimeDeleteDraftOperation"
        discard:
          $ref: "#/components/schemas/RuntimeDiscardDraftOperation"
    RuntimeCreateDraftOperation:
      type: object
      required: [path, body]
      properties:
        path:
          type: string
        body:
          type: string
        description:
          type: string
    RuntimeUpdateDraftOperation:
      type: object
      required: [id, body]
      properties:
        id:
          type: string
        body:
          type: string
        description:
          type: string
    RuntimeRenameDraftOperation:
      type: object
      required: [id, new_path]
      properties:
        id:
          type: string
        new_path:
          type: string
        description:
          type: string
    RuntimeDeleteDraftOperation:
      type: object
      required: [id]
      properties:
        id:
          type: string
        description:
          type: string
    RuntimeDiscardDraftOperation:
      type: object
      required: [id]
      properties:
        id:
          type: string
    RuntimeDraftOperationResponse:
      type: object
      required: [local_operation_id, draft_id, queued, sync_status]
      properties:
        local_operation_id:
          type: string
        draft_id:
          type: string
        queued:
          type: boolean
        sync_status:
          $ref: "#/components/schemas/DraftOperationSyncStatus"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
    ApiError:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    SyncState:
      type: string
      enum: [idle, queued, syncing, degraded, failed]
    RuntimeDraftResourceKind:
      type: string
      enum: [context, rule, workflow, metaprompt]
    DraftOperationSyncStatus:
      type: string
      enum: [queued, syncing, synced, failed]
