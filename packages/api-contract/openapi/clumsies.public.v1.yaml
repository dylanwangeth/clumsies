    post:
      operationId: createReviewDecision
      summary: Create a review decision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewDecisionRequest"
      responses:
        "200":
          description: Review after decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}/conflict-resolutions:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    post:
      operationId: createReviewConflictResolution
      summary: Replace a conflicted draft with a resolution based on the current Ref.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewConflictResolutionRequest"
      responses:
        "200":
          description: Reopened review with the resolved draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDetail"
        "412":
          description: The target Ref changed before the resolution was applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}/merges:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    post:
      operationId: createReviewMerge
      summary: Merge an approved review and produce authoritative external-memory resources.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewMergeRequest"
      responses:
        "200":
          description: Merge result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewMergeResult"
        "409":
          description: The draft base Commit is no longer the current Ref.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "412":
          description: The If-Match Ref is no longer current.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/commits:
    get:
      operationId: listOrgCommits
      summary: List organization external-memory commits.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Organization commit page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/commit-state:
    get:
      operationId: getOrgCommitState
      summary: Read organization commit update state.
      parameters:
        - name: local_commit_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Organization commit update state.
          headers:
            ETag:
              description: Current organization refs/heads/main commit ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitStateResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/commits:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectCommits
      summary: List project external-memory commits.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Project commit page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/commit-state:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectCommitState
      summary: Read project commit update state.
      parameters:
        - name: local_commit_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Project commit update state.
          headers:
            ETag:
              description: Current project refs/heads/main commit ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitStateResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/commits/{commit_id}:
    parameters:
      - $ref: "#/components/parameters/CommitId"
    get:
      operationId: getCommit
      summary: Download or read an external-memory commit payload.
      responses:
        "200":
          description: Commit payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitPayload"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema:
        type: string
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
    ProjectIdQuery:
      name: project_id
      in: query
      schema:
        type: string
    RuleId:
      name: rule_id
      in: path
      required: true
      schema:
        type: string
    ContextId:
      name: context_id
      in: path
      required: true
      schema:
        type: string
    WorkflowId:
      name: workflow_id
      in: path
      required: true
      schema:
        type: string
    BundleId:
      name: bundle_id
      in: path
      required: true
      schema:
        type: string
    DraftId:
      name: draft_id
      in: path
      required: true
      schema:
        type: string
    ReviewId:
