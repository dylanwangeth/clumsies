          items:
            $ref: "#/components/schemas/TreeEntry"
    TreeEntry:
      type: object
      required: [id, type, scope, project_id, path, blob_id, source]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [rule, context, workflow, metaprompt, project_org_selection]
        scope:
          type: string
          enum: [org, project, daemon]
        project_id:
          type: [string, "null"]
        path:
          type: [string, "null"]
        blob_id:
          type: string
        source:
          type: string
          enum: [org, project, selected_org, bootstrap, config]
    Blob:
      type: object
      required: [blob_id, content]
      properties:
        blob_id:
          type: string
        content:
          type: string
    ProjectOrgSelection:
      type: object
      required: [project_id, rules, context, workflows, revision]
      properties:
        project_id:
          type: string
        rules:
          type: array
          items:
            $ref: "#/components/schemas/RuleMeta"
        context:
          type: array
          items:
            $ref: "#/components/schemas/ContextMeta"
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowMeta"
        revision:
          type: integer
    DeleteResult:
      type: object
      required: [deleted, id]
      properties:
        deleted:
          type: boolean
        id:
          type: string
    PageInfo:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
    UserRef:
      type: object
      required: [user_id, email, display_name, avatar_url, role]
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: [string, "null"]
        avatar_url:
          type: [string, "null"]
          format: uri
        role:
          type: string
    ClientKind:
      type: string
      enum: [desktop, cli, web_admin]
    OrgRef:
      type: object
      required: [org_id, name]
      properties:
        org_id:
          type: string
        name:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
    ApiError:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    ResourceScope:
      type: string
      enum: [org, project]
    ResourceStatus:
      type: string
      enum: [active, deprecated, archived]
    CommitScope:
      type: string
      enum: [org, project]
    DraftStatus:
      type: string
      enum: [open, submitted, discarded, conflicted]
    DraftResourceKind:
      type: string
      enum: [context, rule, workflow, metaprompt]
    DraftOperationAction:
      type: string
      enum: [create, update, rename, delete]
    ReviewStatus:
      type: string
      enum: [open, approved, rejected, merged]
