openapi: 3.1.0
info:
  title: clumsies Public API
  version: 1.0.0
  summary: Public Hub API for Desktop and CLI.
servers:
  - url: https://hub.clumsies.local
security:
  - bearerAuth: []
paths:
  /api/v1/auth/token:
    post:
      operationId: createAuthToken
      summary: Exchange an authorization code or refresh token for clumsies tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/session:
    delete:
      operationId: revokeSession
      summary: Revoke the current session.
      responses:
        "200":
          description: Session revocation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevoked"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Read the current user bootstrap payload.
      responses:
        "200":
          description: Current user, organization, projects, and capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects accessible to the current user.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Project page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProject
      summary: Create a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "200":
          description: Created project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Read a project.
      responses:
        "200":
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProject
      summary: Update project metadata.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProject
      summary: Delete a project.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/bundles:
    get:
      operationId: listPersonalBundles
      summary: List personal Bundles owned by the current user.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Personal Bundle page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBundleListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPersonalBundle
      summary: Create a user-owned personal Bundle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalBundleRequest"
      responses:
        "200":
          description: Created personal Bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBundleDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/bundles/{bundle_id}:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: getPersonalBundle
      summary: Read a personal Bundle.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Personal Bundle detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBundleDetail"
        "304":
          description: ETag matched.
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updatePersonalBundle
      summary: Update a personal Bundle.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalBundleUpdateRequest"
      responses:
        "200":
          description: Updated personal Bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBundleDetail"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePersonalBundle
      summary: Delete a personal Bundle.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/rules:
    get:
      operationId: listOrgRules
      summary: List organization rules.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Organization rule page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/rules/{rule_id}:
    parameters:
      - $ref: "#/components/parameters/RuleId"
    get:
      operationId: getOrgRule
      summary: Read an organization rule.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Organization rule detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleDetail"
        "304":
          description: ETag matched.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/context:
    get:
      operationId: listOrgContext
      summary: List organization context entries.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Organization context page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/context/{context_id}:
    parameters:
      - $ref: "#/components/parameters/ContextId"
    get:
      operationId: getOrgContext
      summary: Read an organization context entry.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Organization context detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextDetail"
        "304":
          description: ETag matched.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/workflows:
    get:
      operationId: listOrgWorkflows
      summary: List organization workflows.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Organization workflow page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/workflows/{workflow_id}:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
    get:
      operationId: getOrgWorkflow
      summary: Read an organization workflow.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Organization workflow detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDetail"
        "304":
          description: ETag matched.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/rules:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectRules
      summary: List project rules.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Project rule page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/rules/{rule_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RuleId"
    get:
      operationId: getProjectRule
      summary: Read a project rule.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Project rule detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleDetail"
        "304":
          description: ETag matched.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/context:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectContext
      summary: List project context entries.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Project context page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/context/{context_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ContextId"
    get:
      operationId: getProjectContext
      summary: Read a project context entry.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Project context detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextDetail"
        "304":
          description: ETag matched.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/workflows:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectWorkflows
      summary: List project workflows.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Project workflow page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/workflows/{workflow_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/WorkflowId"
    get:
      operationId: getProjectWorkflow
      summary: Read a project workflow.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Project workflow detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDetail"
        "304":
          description: ETag matched.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/org-selections:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectOrgSelection
      summary: Read organization memory selected by a project.
      responses:
        "200":
          description: Project organization memory selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOrgSelection"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: replaceProjectOrgSelection
      summary: Replace organization memory selected by a project.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceProjectOrgSelectionRequest"
      responses:
        "200":
          description: Updated project organization memory selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOrgSelection"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/drafts:
    get:
      operationId: listDrafts
      summary: List current user's personal drafts.
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Draft page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createDraft
      summary: Create a personal draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftRequest"
      responses:
        "200":
          description: Created draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/drafts/{draft_id}:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    get:
      operationId: getDraft
      summary: Read a personal draft.
      responses:
        "200":
          description: Draft detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftDetail"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateDraft
      summary: Update draft metadata.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDraftRequest"
      responses:
        "200":
          description: Updated draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftDetail"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteDraft
      summary: Discard a personal draft.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/drafts/{draft_id}/operations:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    post:
      operationId: appendDraftOperation
      summary: Append an operation to a personal draft.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendDraftOperationRequest"
      responses:
        "200":
          description: Draft after appending the operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/draft-events:
    get:
      operationId: listDraftEvents
      summary: Read draft sync events.
      parameters:
        - name: after_cursor
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Draft sync events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEventListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/draft-operation-batches:
    post:
      operationId: createDraftOperationBatch
      summary: Submit local draft operations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftOperationBatchRequest"
      responses:
        "200":
          description: Accepted draft operations and new sync cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftOperationBatchResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews:
    get:
      operationId: listReviews
      summary: List reviews.
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Review page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createReview
      summary: Create a review from a draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "200":
          description: Created review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      operationId: getReview
      summary: Read a review.
      responses:
        "200":
          description: Review detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}/comments:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      operationId: listReviewComments
      summary: List review comments.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Review comment page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCommentListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createReviewComment
      summary: Add a review comment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewCommentRequest"
      responses:
        "200":
          description: Created review comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewComment"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}/decisions:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    post:
      operationId: createReviewDecision
      summary: Create a review decision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewDecisionRequest"
      responses:
        "200":
          description: Review after decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reviews/{review_id}/merges:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    post:
      operationId: createReviewMerge
      summary: Merge an approved review and produce authoritative memory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewMergeRequest"
      responses:
        "200":
          description: Merge result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewMergeResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/snapshots:
    get:
      operationId: listOrgSnapshots
      summary: List organization memory snapshots.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Organization snapshot page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/org/snapshot-state:
    get:
      operationId: getOrgSnapshotState
      summary: Read organization snapshot update state.
      parameters:
        - name: local_snapshot_id
          in: query
          schema:
            type: string
        - name: local_org_version
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Organization snapshot update state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotStateResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/snapshots:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectSnapshots
      summary: List project memory snapshots.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Project snapshot page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}/snapshot-state:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectSnapshotState
      summary: Read project snapshot update state.
      parameters:
        - name: local_snapshot_id
          in: query
          schema:
            type: string
        - name: local_project_version
          in: query
          schema:
            type: integer
        - name: local_org_snapshot_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Project snapshot update state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotStateResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/snapshots/{snapshot_id}:
    parameters:
      - $ref: "#/components/parameters/SnapshotId"
    get:
      operationId: getSnapshot
      summary: Download or read a memory snapshot payload.
      responses:
        "200":
          description: Snapshot payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotPayload"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema:
        type: string
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
    ProjectIdQuery:
      name: project_id
      in: query
      schema:
        type: string
    RuleId:
      name: rule_id
      in: path
      required: true
      schema:
        type: string
    ContextId:
      name: context_id
      in: path
      required: true
      schema:
        type: string
    WorkflowId:
      name: workflow_id
      in: path
      required: true
      schema:
        type: string
    BundleId:
      name: bundle_id
      in: path
      required: true
      schema:
        type: string
    DraftId:
      name: draft_id
      in: path
      required: true
      schema:
        type: string
    ReviewId:
      name: review_id
      in: path
      required: true
      schema:
        type: string
    SnapshotId:
      name: snapshot_id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    TokenRequest:
      type: object
      oneOf:
        - required: [grant_type, code, code_verifier]
