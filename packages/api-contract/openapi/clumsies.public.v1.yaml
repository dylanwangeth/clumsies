    get:
      operationId: getProjectOrgSelection
      summary: Read organization resources selected by a project.
      responses:
        "200":
          description: Project organization memory selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOrgSelection"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: replaceProjectOrgSelection
      summary: Replace organization resources selected by a project.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceProjectOrgSelectionRequest"
      responses:
        "200":
          description: Updated project organization memory selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOrgSelection"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/drafts:
    get:
      operationId: listDrafts
      summary: List current user's personal drafts.
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Draft page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createDraft
      summary: Create a personal draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftRequest"
      responses:
