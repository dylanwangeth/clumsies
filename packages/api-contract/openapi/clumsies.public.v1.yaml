        expires_in:
          type: integer
        user:
          $ref: "#/components/schemas/UserRef"
        org:
          $ref: "#/components/schemas/OrgRef"
        capabilities:
          type: array
          items:
            type: string
    SessionRevoked:
      type: object
      required: [revoked]
