openapi: 3.1.0
info:
  title: clumsies Public API
  version: 1.0.0
  summary: Public Server API for Desktop and CLI.
servers:
  - url: https://server.clumsies.local
security:
  - bearerAuth: []
paths:
  /oauth2/authorization/oidc:
    get:
      operationId: beginOidcAuthorization
      summary: Begin organization OIDC authorization for a clumsies client.
      security: []
      parameters:
        - name: client_kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ClientKind"
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum: [S256]
        - name: state
          in: query
          schema:
            type: string
        - name: login_hint
          in: query
          schema:
            type: string
            format: email
        - name: return_to
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the configured OIDC authorization endpoint.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        default:
          $ref: "#/components/responses/Error"
  /login/oauth2/code/oidc:
    get:
      operationId: completeOidcAuthorization
      summary: Complete the organization OIDC callback and redirect to the requesting client.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: error_description
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the validated client callback URI.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/token:
    post:
      operationId: createAuthToken
      summary: Exchange an authorization code or refresh token for clumsies tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/session:
    delete:
      operationId: revokeSession
      summary: Revoke the current session.
      responses:
        "200":
          description: Session revocation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevoked"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Read the current user bootstrap payload.
      responses:
        "200":
          description: Current user, organization, projects, and capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects accessible to the current user.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Project page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProject
      summary: Create a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "200":
          description: Created project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Read a project.
      responses:
        "200":
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProject
      summary: Update project metadata.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProject
      summary: Delete a project.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/bundles:
    get:
      operationId: listPersonalBundles
      summary: List personal Bundles owned by the current user.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Personal Bundle page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBundleListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPersonalBundle
      summary: Create a user-owned personal Bundle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalBundleRequest"
      responses:
        "200":
          description: Created personal Bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBundleDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/bundles/{bundle_id}:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      operationId: getPersonalBundle
      summary: Read a personal Bundle.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Personal Bundle detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBundleDetail"
        "304":
          description: ETag matched.
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updatePersonalBundle
      summary: Update a personal Bundle.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalBundleUpdateRequest"
      responses:
        "200":
          description: Updated personal Bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBundleDetail"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePersonalBundle
      summary: Delete a personal Bundle.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Delete result.
          content:
