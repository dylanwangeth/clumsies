name: clumsies

x-proxy-environment: &proxy-environment
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  ALL_PROXY: ${ALL_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}
  http_proxy: ${http_proxy:-}
  https_proxy: ${https_proxy:-}
  all_proxy: ${all_proxy:-}
  no_proxy: ${no_proxy:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CLUMSIES_DB_NAME:-clumsies}
      POSTGRES_USER: ${CLUMSIES_DB_USER:-clumsies}
      POSTGRES_PASSWORD: ${CLUMSIES_DB_PASSWORD:?CLUMSIES_DB_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - clumsies-postgres:/var/lib/postgresql/data
    networks:
      - clumsies

  server:
    build:
      context: .
      dockerfile: crates/server/Dockerfile
      args:
        <<: *proxy-environment
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *proxy-environment
      DATABASE_URL: postgres://${CLUMSIES_DB_USER:-clumsies}:${CLUMSIES_DB_PASSWORD}@postgres:5432/${CLUMSIES_DB_NAME:-clumsies}
      CLUMSIES_SERVER_ADDR: 0.0.0.0:8080
      CLUMSIES_BOOTSTRAP_ORG_NAME: ${CLUMSIES_BOOTSTRAP_ORG_NAME:?CLUMSIES_BOOTSTRAP_ORG_NAME must be set}
      CLUMSIES_BOOTSTRAP_OWNER_EMAIL: ${CLUMSIES_BOOTSTRAP_OWNER_EMAIL:?CLUMSIES_BOOTSTRAP_OWNER_EMAIL must be set}
      CLUMSIES_BOOTSTRAP_OWNER_NAME: ${CLUMSIES_BOOTSTRAP_OWNER_NAME:?CLUMSIES_BOOTSTRAP_OWNER_NAME must be set}
      CLUMSIES_BOOTSTRAP_PROJECT_NAME: ${CLUMSIES_BOOTSTRAP_PROJECT_NAME:-Default}
      CLUMSIES_OIDC_CLIENT_ID: ${CLUMSIES_OIDC_CLIENT_ID:-}
      CLUMSIES_OIDC_CLIENT_SECRET: ${CLUMSIES_OIDC_CLIENT_SECRET:-}
      CLUMSIES_OIDC_CALLBACK_URL: ${CLUMSIES_OIDC_CALLBACK_URL:-}
      CLUMSIES_OIDC_ISSUER: ${CLUMSIES_OIDC_ISSUER:-}
      CLUMSIES_CLIENT_REDIRECT_URIS: ${CLUMSIES_CLIENT_REDIRECT_URIS:-}
      CLUMSIES_CORS_ORIGINS: ${CLUMSIES_CORS_ORIGINS:-}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/admin/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - clumsies

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      <<: *proxy-environment
      CLUMSIES_SERVER_HOST: ${CLUMSIES_SERVER_HOST:?CLUMSIES_SERVER_HOST must be set}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - clumsies-caddy-data:/data
      - clumsies-caddy-config:/config
    networks:
      - clumsies

networks:
  clumsies:

volumes:
  clumsies-postgres:
  clumsies-caddy-data:
  clumsies-caddy-config:
