services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CLUMSIES_DB_NAME:-clumsies}
      POSTGRES_USER: ${CLUMSIES_DB_USER:-clumsies}
      POSTGRES_PASSWORD: ${CLUMSIES_DB_PASSWORD:-clumsies}
    ports:
      - "${CLUMSIES_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - clumsies-postgres:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: crates/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${CLUMSIES_DB_USER:-clumsies}:${CLUMSIES_DB_PASSWORD:-clumsies}@postgres:5432/${CLUMSIES_DB_NAME:-clumsies}
      CLUMSIES_SERVER_ADDR: 0.0.0.0:8080
      CLUMSIES_BOOTSTRAP_ORG_NAME: ${CLUMSIES_BOOTSTRAP_ORG_NAME:-Clumsies}
      CLUMSIES_BOOTSTRAP_OWNER_EMAIL: ${CLUMSIES_BOOTSTRAP_OWNER_EMAIL:-owner@clumsies.local}
      CLUMSIES_BOOTSTRAP_OWNER_NAME: ${CLUMSIES_BOOTSTRAP_OWNER_NAME:-Owner}
      CLUMSIES_BOOTSTRAP_PROJECT_NAME: ${CLUMSIES_BOOTSTRAP_PROJECT_NAME:-Default}
      CLUMSIES_OIDC_CLIENT_ID: ${CLUMSIES_OIDC_CLIENT_ID:-}
      CLUMSIES_OIDC_CLIENT_SECRET: ${CLUMSIES_OIDC_CLIENT_SECRET:-}
      CLUMSIES_OIDC_CALLBACK_URL: ${CLUMSIES_OIDC_CALLBACK_URL:-}
      CLUMSIES_OIDC_ISSUER: ${CLUMSIES_OIDC_ISSUER:-}
      CLUMSIES_CLIENT_REDIRECT_URIS: ${CLUMSIES_CLIENT_REDIRECT_URIS:-}
      CLUMSIES_CORS_ORIGINS: ${CLUMSIES_CORS_ORIGINS:-http://127.0.0.1:1420,http://localhost:1420}
    ports:
      - "${CLUMSIES_SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/admin/health"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  clumsies-postgres:
