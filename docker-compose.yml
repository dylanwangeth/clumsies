services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clumsies
      POSTGRES_USER: clumsies
      POSTGRES_PASSWORD: clumsies
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clumsies"]
      interval: 2s
      timeout: 5s
      retries: 10
