services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${HUB_DB_NAME:-clumsies}
      POSTGRES_USER: ${HUB_DB_USER:-clumsies}
      POSTGRES_PASSWORD: ${HUB_DB_PASSWORD:-clumsies}
    ports:
      - "${HUB_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 10
