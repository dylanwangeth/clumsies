[package]
name = "server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "clumsies-server"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
base64 = "0.22.1"
hex = "0.4.3"
openidconnect = "4.0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "migrate"] }
subtle = "2.6.1"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["serde", "serde-human-readable", "macros"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors"] }
url = "2.5.8"
uuid = { version = "1.23.4", features = ["v4", "serde"] }

[dev-dependencies]
serde_yaml_ng = "0.10.0"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
